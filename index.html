<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniRoute</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0;padding:20px;text-align:center}
h1{font-size:28px;margin:10px 0 5px}
p{color:#94a3b8;margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:500px;margin:0 auto}
button{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:16px;padding:20px 10px;font-size:17px;cursor:pointer}
button span{display:block;font-size:28px;margin-bottom:8px}
button.main{background:#7c3aed;border-color:#7c3aed;grid-column:span 2}
</style>
</head>
<body>
<h1>OmniRoute</h1>
<p>كل خدمات الذكاء الاصطناعي في مكان واحد</p>
<div class="grid">
<button class="main" onclick="alert('صورتي تتكلم - جاري التجهيز')"><span>🎥</span>صورتي تتكلم</button>
<button onclick="alert('اكتبلي - جاري التجهيز')"><span>✍️</span>اكتبلي</button>
<button onclick="alert('ترجملي - جاري التجهيز')"><span>🌍</span>ترجملي</button>
<button onclick="alert('نص لصوت - جاري التجهيز')"><span>🔊</span>نص لصوت</button>
<button onclick="alert('انسخ صوتي - جاري التجهيز')"><span>🎙️</span>انسخ صوتي</button>
<button onclick="alert('اعملي فيديو - جاري التجهيز')"><span>🎬</span>اعملي فيديو</button>
<button onclick="alert('اعملي صورة - جاري التجهيز')"><span>🖼️</span>اعملي صورة</button>
</div>
</body>
</html>
