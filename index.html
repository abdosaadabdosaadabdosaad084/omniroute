<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniRoute</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#0b1226;color:#fff;text-align:center;padding:20px}
h1{margin:10px 0 0;font-size:34px}
p{color:#94a3b8}
.hero{background:#7c3aed;border:0;color:#fff;width:100%;padding:18px;border-radius:16px;font-size:20px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:#16203a;border:1px solid #26314d;padding:20px;border-radius:16px;font-size:18px;cursor:pointer}
.box{background:#16203a;border:1px solid #26314d;border-radius:16px;padding:16px;margin-top:14px;display:none;text-align:right}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0b1226;color:#fff;margin:8px 0}
#preview{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:none}
.btn{background:#7c3aed;border:0;color:#fff;width:100%;padding:14px;border-radius:12px;font-size:18px;cursor:pointer;margin-top:8px}
.btn2{background:#334155;border:0;color:#fff;width:100%;padding:12px;border-radius:12px;font-size:16px;cursor:pointer;margin-top:8px}
#msg{color:#facc15;font-size:14px;text-align:center;margin-top:6px}
</style>
</head>
<body>
<h1>OmniRoute</h1>
<p>كل خدمات الذكاء الاصطناعي في مكان واحد</p>
<button class="hero" onclick="showBox('talkBox')">🎥 صورتي تتكلم</button>

<div class="box" id="talkBox">
<input type="file" accept="image/*" onchange="loadImg(event)">
<img id="preview">
<textarea id="txt1" rows="3">أهلا بيكم في OmniRoute</textarea>
<button class="btn" onclick="speak('txt1')">خليها تتكلم 🔊</button>
<div id="msg1"></div>
</div>

<div class="box" id="ttsBox">
<h3 style="margin:0">🔊 نص لصوت</h3>
<textarea id="txt2" rows="4">السلام عليكم ورحمة الله وبركاته</textarea>
<p style="font-size:13px">بيشتغل في Phoenix - عربي وانجليزي تلقائي</p>
<button class="btn" onclick="speak('txt2')">اسمع الصوت 🔊</button>
<button class="btn2" onclick="stopSpeak()">وقف ⏹️</button>
<div id="msg"></div>
<audio id="player" style="display:none"></audio>
</div>

<div class="grid">
<div class="card">🌍<br>ترجملي</div>
<div class="card">✍️<br>اكتبلي</div>
<div class="card">🎤<br>انسخ صوتي</div>
<div class="card" onclick="showBox('ttsBox')">🔊<br>نص لصوت</div>
<div class="card">🖼️<br>اعملي صورة</div>
<div class="card">🎬<br>اعملي فيديو</div>
</div>

<script>
let player=document.getElementById('player');
function showBox(id){
document.getElementById('talkBox').style.display='none';
document.getElementById('ttsBox').style.display='none';
document.getElementById(id).style.display='block';
window.scrollTo({top:200,behavior:'smooth'});
}
function loadImg(e){
let f=e.target.files[0]; if(!f) return;
let r=new FileReader();
r.onload=function(){ let img=document.getElementById('preview'); img.src=r.result; img.style.display='block'; };
r.readAsDataURL(f);
}
function speak(txtId){
let t=document.getElementById(txtId).value.trim(); if(!t) return;
let isArabic=/[\u0600-\u06FF]/.test(t);
let lang=isArabic ? 'ar' : 'en';
// طريقة جوجل - بتشتغل في Phoenix
let url='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&q='+encodeURIComponent(t)+'&tl='+lang;
showMsg(txtId,'جارٍ تشغيل الصوت... 🔊');
player.src=url;
player.play().then(()=>{ showMsg(txtId,'شغال ✅'); }).catch(()=>{ showMsg(txtId,'افتح النت وعلي الصوت وجرب تاني'); });
}
function showMsg(txtId,msg){ let id= txtId=='txt1' ? 'msg1':'msg'; document.getElementById(id).innerText=msg; }
function stopSpeak(){ player.pause(); player.currentTime=0; }
</script>
</body>
</html>
